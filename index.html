<!DOCTYPE html>
<html>
<head>
    <title>Megafauna</title>

    
    <style>
        .ccDifficulty {
    min-width: 120px;
    white-space: nowrap;
}
        #siteLogo {
    display: block;
    width: 280px;
    max-width: 90%;
    height: auto;
    margin: 0 auto 20px;
}
.difficultyBar {
    width: 100%;
    height: 10px;
    margin-top: 6px;
    background: #e2e5e9;
    border-radius: 5px;
    overflow: hidden;
}

.difficultyBarFill {
    height: 100%;
    background: #4b647c;
    border-radius: 5px;
}
        .ccProgress {
    min-width: 120px;
}

.progressBar {
    display: flex;
    width: 100%;
    height: 14px;
    background: #e2e5e9;
    border-radius: 0;
    overflow: hidden;
    border: 1px solid #c7cdd4;
    box-sizing: border-box;
}

.progressBarGreen {
    background: #26965b;
}

.progressBarRed {
    background: #d94b4b;
}

.progressBarEmpty {
    background: #e2e5e9;
}
        
.progressBarSpacer {
    height: 18px;
}
#helpButtonsRow {
    display: grid;
    grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
    gap: 8px;
    align-items: start;
    width: 100%;
    max-width: 620px;
    margin: 16px auto;
}

.helpPanel {
    min-width: 0;
}

#thinkingAidControls {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
}

.thinkingAidButton {
    background: #38744b;
}

.thinkingAidButton:hover {
    background: #2b5c3b;
}

.solutionHintButton {
    background: #4b647c;
}

.solutionHintButton:hover {
    background: #394f65;
}

#thinkingAidPanel p,
#solutionHintPanel p {
    margin: 8px 0;
}

@media (max-width: 520px) {
    #helpButtonsRow {
        grid-template-columns: 1fr;
    }
}
        #ccMenu {
    margin: 20px auto;
}
        #mainMenuLayout {
    display: grid;
    grid-template-columns: minmax(170px, 1fr) minmax(420px, 1.25fr) minmax(170px, 0.8fr);
    gap: 28px;
    align-items: start;
    text-align: left;
    width: 100%;
}

#ccMenu {
    min-width: 0;
    width: 100%;
    max-width: 900px;
    margin: 0 auto;
}

@media (max-width: 750px) {
    #mainMenuLayout {
        grid-template-columns: 1fr;
    }
}

#ccSetTable {
    width: 100%;
    border-collapse: collapse;
    background: white;
    border-radius: 10px;
    overflow: hidden;
    box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
}

#ccSetTable th,
#ccSetTable td {
    padding: 14px 12px;
    border-bottom: 1px solid #eee;
    text-align: left;
}

#ccSetTable th {
    background: #e9edf2;
}

#ccSetTable tbody tr {
    cursor: pointer;
}

#ccSetTable tbody tr:hover {
    background: #f0f4f8;
}

#ccSetTable tbody tr:last-child td {
    border-bottom: none;
}

.ccSetTitle {
    font-weight: bold;
}

.ccDifficulty {
    white-space: nowrap;
}

#backToSets {
    margin-bottom: 15px;
}
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            max-width: 1200px;
            margin: 0 auto;
            padding: 40px 20px;
            background: #f5f7fa;
        }

        h1 {
            font-size: 42px;
            margin-bottom: 30px;
        }

        h2 {
            font-size: 32px;
            letter-spacing: 3px;
        }

        #target {
            margin-top: 5px;
        }

        #remaining {
            background: white;
            border-radius: 12px;
            padding: 15px;
            margin: 10px auto 25px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
        }

        #wordInput {
            width: 260px;
            padding: 12px;
            font-size: 17px;
            border: 1px solid #ccc;
            border-radius: 8px;
            box-sizing: border-box;
        }

        button {
            padding: 12px 18px;
            margin: 6px 3px;
            font-size: 15px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            background: #333;
            color: white;
        }

        button:hover {
            background: #555;
        }

        #message {
            min-height: 24px;
            margin: 15px;
        }

        #solverResult {
            min-height: 24px;
            margin: 15px;
            font-weight: bold;
        }

        #wordList {
            list-style-position: inside;
            padding: 0;
        }
        #equivFinderPanel {
    position: fixed;
    top: 20px;
    right: 20px;
    width: 240px;
    padding: 16px;
    background: white;
    border-radius: 12px;
    box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
    text-align: left;
}

#equivFinderInput {
    width: 100%;
    padding: 8px;
    box-sizing: border-box;
}

#equivFinderResult {
    max-height: 45vh;
    overflow-y: auto;
    overflow-wrap: anywhere;
}

@media (max-width: 1000px) {
    #equivFinderPanel {
        position: static;
        width: auto;
        max-width: 500px;
        margin: 30px auto;
    }
}
    </style>
</head>

<title>Megafauna v0.8</title>
<div id="mainMenuLayout">

    
    <div id="ccMenu">
    <h2>Curated Challenges</h2>
   
    <p>Choose a set to begin.</p>

    <table id="ccSetTable">
        <thead>
            <tr>
                <th>Set</th>
                <th>Description</th>
                <th>Average difficulty</th>
                <th>Progress</th>
            </tr>
        </thead>
        <tbody id="ccSetTableBody"></tbody>
    </table>
</div>
</div>

<div id="gameScreen" style="display: none;">
    <button id="backToSets" onclick="showCCMenu()">← Back to Sets</button>
    <p id="puzzleNumber">Puzzle #1</p>
    <div>
    <button id="previousPuzzle" onclick="previousPuzzle()">← Previous</button>
    <button id="nextPuzzle" onclick="nextPuzzle()">Next →</button>
</div>
<p>Target:</p>
<h2 id="target">A</h2>

<div id="scorePanel">
    <p>Score: <strong id="score">100</strong></p>
    <p id="scoreMessage"></p>
</div>

<div id="helpButtonsRow">
    <div id="thinkingAidPanel" class="helpPanel">
        <button
            id="unlockThinkingAid"
            class="thinkingAidButton"
            onclick="unlockThinkingAid()"
        >
            Unlock Thinking Aid (−20 points)
        </button>

        <p id="thinkingAidStatus">Thinking aid locked.</p>

        <div id="thinkingAidControls">
            <button
                id="shuffleButton"
                class="thinkingAidButton"
                onclick="shuffleLetters()"
                disabled
            >
                Shuffle
            </button>

            <button
                id="addPairsButton"
                class="thinkingAidButton"
                onclick="addPairs()"
                disabled
            >
                Add Pairs
            </button>

            <button
                id="revertButton"
                class="thinkingAidButton"
                onclick="revertPairs()"
                disabled
            >
                Revert
            </button>
        </div>
    </div>

    <div id="solutionHintPanel" class="helpPanel">
        <button
            id="solutionHintButton"
            class="solutionHintButton"
            onclick="revealSolutionHint()"
        >
            Reveal 1-solve lengths (−20 points)
        </button>

        <p id="solutionHintResult"></p>
    </div>
</div>
<div id="remainingPanel" style="display: none;">
    <p>Remaining letters:</p>
    <h2 id="remaining">HAPPINESS</h2>
</div>

    <input id="wordInput" type="text" placeholder="Enter a word">

   <div id="wordActionButtons">
    <button onclick="addWord()">Add</button>
    <button onclick="solvePuzzle()">Solve(DO NOT USE UNLESS DEV)</button>
    <button onclick="newPuzzle()">Random Puzzle(from dictionary, not part of sets)</button>
</div>
    <p id="message"></p>
    <p id="solverResult"></p>

    <h3>Words played:</h3>
    <ul id="wordList"></ul>
    <aside id="equivFinderPanel">
    <h3>Dev: Equivalence Finder</h3>
    <input id="equivFinderInput" type="text" placeholder="Enter any string">
    <select id="equivFinderSort">
    <option value="alphabetical">Alphabetical</option>
    <option value="length">By length</option>
</select>
    <button onclick="equivFinder(document.getElementById('equivFinderInput').value)">Find equivalents(DO NOT USE UNLESS DEV)</button>
    <p id="equivFinderResult" aria-live="polite"></p>
</aside>
    </div>
    <script src="game.js"></script>
</body>
</html>
